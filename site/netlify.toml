[build]
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"

# Edge function "gate" auths the site. Its path config lives in
# netlify/edge-functions/gate.ts (gates everything by default; an EXEMPT
# list there names the public paths). Don't add path config for it here —
# keep the source of truth in code.

[[redirects]]
  from = "/api/auth/config"
  to = "/.netlify/functions/auth-config"
  status = 200
[[redirects]]
  from = "/api/auth/exchange"
  to = "/.netlify/functions/auth-exchange"
  status = 200
[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
[[redirects]]
  from = "/api/access/request"
  to = "/.netlify/functions/access-request"
  status = 200
[[redirects]]
  from = "/api/admin/requests"
  to = "/.netlify/functions/admin-requests"
  status = 200
[[redirects]]
  from = "/api/admin/approve"
  to = "/.netlify/functions/admin-approve"
  status = 200
[[redirects]]
  from = "/api/admin/deny"
  to = "/.netlify/functions/admin-deny"
  status = 200
[[redirects]]
  from = "/api/admin/allowlist"
  to = "/.netlify/functions/admin-allowlist"
  status = 200
[[redirects]]
  from = "/api/admin/run-pipeline"
  to = "/.netlify/functions/admin-run-pipeline"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/plotly.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
