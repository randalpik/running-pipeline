<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in - Max's Running Data</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh;
      display: grid; place-items: center;
      background: #0e0e10; color: #e6e6e6;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    .card {
      max-width: min(500px, calc(100vw - 12px));
      min-height: 240px;
      box-sizing: border-box;
      background: #17171a; border: 1px solid #2a2a2f; border-radius: 12px;
      padding: 32px 28px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      display: flex; flex-direction: column;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #a8a8ae; margin: 0 0 20px; }
    /* GIS renders inside a cross-origin iframe that inherits color-scheme
       from the parent. Under our page's color-scheme: dark, the iframe's
       UA chrome paints white artifacts around the button. Forcing
       color-scheme: light on this wrapper only makes the iframe render
       cleanly; theme: "filled_black" below still keeps the button dark.
       Width matches renderButton({width: 199}) — width must be <200 to
       suppress GIS's "Continue as [Name]" personalized button (per
       https://developers.google.com/identity/gsi/web/guides/personalized-button).
       Height matches size:large so the placeholder box is identical to
       the iframe — no layout shift when GIS mounts asynchronously. */
    .gbtn {
      display: flex; justify-content: center; align-items: center;
      align-self: center;
      width: 199px; height: 44px;
      color-scheme: light;
    }
    label { display: block; font-size: .9rem; color: #a8a8ae; margin: 14px 0 6px; }
    textarea, input[type="text"] {
      width: 100%; box-sizing: border-box;
      background: #0e0e10; color: #e6e6e6;
      border: 1px solid #2a2a2f; border-radius: 8px;
      padding: 10px 12px; font: inherit; resize: vertical;
    }
    button.primary {
      margin-top: 14px; width: 100%;
      background: #3478f6; color: white; border: 0; border-radius: 8px;
      padding: 11px 16px; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    button.primary:disabled { opacity: .6; cursor: progress; }
    .hidden { display: none !important; }
    .muted { color: #777; font-size: .85rem; }
    .email-text { color: #e6e6e6; font-weight: 600; }
    .back-link {
      align-self: flex-start;
      font-size: .85rem; color: #6aa6ff;
      text-decoration: none;
      background: none; border: 0; padding: 0;
      cursor: pointer; font-family: inherit;
      margin-bottom: 12px;
    }
    .back-link:hover { text-decoration: underline; }
    .error { color: #ff6b6b; font-size: .9rem; margin-top: 12px; min-height: 1.2em; }
    .success {
      color: #6be08a;
      background: #14201a; border: 1px solid #20402c;
      padding: 14px 16px; border-radius: 8px;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="card">
    <section id="signin">
      <h1>Max's Running Data</h1>
      <p>Sign in to continue.</p>
      <div class="gbtn" id="gbtn"></div>
      <div class="error" id="signin-err" role="alert"></div>
    </section>

    <section id="request" class="hidden">
      <button type="button" class="back-link" id="req-back">← Use a different account</button>
      <h1>Request access</h1>
      <p>Hi <span id="req-name">there</span>, your account <strong id="req-email" class="email-text"></strong> isn't on the access list. Submit a request and Max will review it.</p>
      <label for="req-message">Message (optional)</label>
      <textarea id="req-message" rows="3" placeholder="Who you are, how you know Max, etc."></textarea>
      <button class="primary" id="req-submit">Submit request</button>
      <div class="error" id="req-err" role="alert"></div>
    </section>

    <section id="submitted" class="hidden">
      <div class="success">
        <strong>Request submitted.</strong>
        <div class="muted" style="margin-top:6px">You'll get access once Max approves it. You can close this tab.</div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/";

    let pendingIdToken = null;

    function show(id) {
      ["signin", "request", "submitted"].forEach((s) => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    async function handleCredential(resp) {
      const idToken = resp.credential;
      pendingIdToken = idToken;
      document.getElementById("signin-err").textContent = "";
      try {
        const r = await fetch("/api/auth/exchange", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.status === "allowed") {
          location.replace(next);
          return;
        }
        if (r.ok && data.status === "unallowed") {
          document.getElementById("req-email").textContent = data.email || "";
          if (data.name) document.getElementById("req-name").textContent = data.name.split(" ")[0];
          show("request");
          return;
        }
        document.getElementById("signin-err").textContent =
          (data && data.error) || "Sign-in failed. Try again.";
      } catch (e) {
        document.getElementById("signin-err").textContent = "Network error. Try again.";
      }
    }

    document.getElementById("req-back").addEventListener("click", () => {
      pendingIdToken = null;
      document.getElementById("req-message").value = "";
      document.getElementById("req-err").textContent = "";
      try { window.google?.accounts?.id?.disableAutoSelect?.(); } catch {}
      show("signin");
    });

    document.getElementById("req-submit").addEventListener("click", async () => {
      const btn = document.getElementById("req-submit");
      const errEl = document.getElementById("req-err");
      errEl.textContent = "";
      if (!pendingIdToken) {
        errEl.textContent = "Sign-in expired. Refresh and try again.";
        return;
      }
      btn.disabled = true;
      try {
        const r = await fetch("/api/access/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idToken: pendingIdToken,
            message: document.getElementById("req-message").value.trim() || undefined,
          }),
        });
        if (r.ok) {
          show("submitted");
          return;
        }
        if (r.status === 429) {
          errEl.textContent = "Too many pending requests. Please email Max directly.";
        } else {
          const data = await r.json().catch(() => ({}));
          errEl.textContent = data.error || "Request failed. Try again.";
        }
      } catch {
        errEl.textContent = "Network error. Try again.";
      } finally {
        btn.disabled = false;
      }
    });

    async function initGsi() {
      let clientId;
      try {
        const r = await fetch("/api/auth/config");
        const data = await r.json();
        clientId = data.googleClientId;
      } catch {
        document.getElementById("signin-err").textContent = "Could not load auth config.";
        return;
      }
      if (!clientId) {
        document.getElementById("signin-err").textContent =
          "OAuth client not configured. Set GOOGLE_OAUTH_CLIENT_ID in Netlify env.";
        return;
      }
      await new Promise((resolve) => {
        const tick = () => {
          if (window.google?.accounts?.id) resolve(undefined);
          else setTimeout(tick, 50);
        };
        tick();
      });
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredential,
        ux_mode: "popup",
        auto_select: false,
      });
      // width<200 suppresses the personalized "Continue as [Name]" button
      // (https://developers.google.com/identity/gsi/web/guides/personalized-button).
      // GIS has no JS flag to disable personalization; width is the lever.
      const gbtn = document.getElementById("gbtn");
      hideGisInlinePlaceholder(gbtn);
      window.google.accounts.id.renderButton(gbtn, {
        type: "standard",
        theme: "filled_black",
        size: "large",
        text: "signin_with",
        shape: "pill",
        width: 199,
      });
    }

    // GIS renders the button in two steps: an inline DOM placeholder
    // (system font, regular weight) is inserted first, then an iframe
    // from accounts.google.com is inserted alongside it. The iframe
    // loads Roboto Medium internally and paints the final "bold" button.
    // The placeholder is supposed to be removed once the iframe is
    // ready, but in practice both coexist for a frame, producing a
    // visible overlap/flicker.
    //
    // GIS's actual structure inside .gbtn is:
    //   .gbtn > div.gsi-wrapper > [div.placeholder, div > iframe]
    // — the placeholder isn't a direct child of .gbtn, it's a sibling
    // of the iframe's wrapper div. We walk up from the iframe and at
    // each level hide any sibling that doesn't contain an iframe.
    function hideGisInlinePlaceholder(wrapper) {
      const hide = () => {
        const iframe = wrapper.querySelector("iframe");
        if (!iframe) return;
        let node = iframe;
        while (node && node !== wrapper) {
          const parent = node.parentElement;
          if (!parent) break;
          for (const sibling of parent.children) {
            if (sibling === node) continue;
            if (sibling.tagName !== "IFRAME" && !sibling.querySelector("iframe")) {
              sibling.style.display = "none";
            }
          }
          node = parent;
        }
      };
      hide();
      new MutationObserver(hide).observe(wrapper, { childList: true, subtree: true });
    }
    initGsi();
  </script>
</body>
</html>
