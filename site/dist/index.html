<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Running Log</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh;
      display: grid; place-items: center;
      background: #0e0e10; color: #e6e6e6;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(540px, calc(100vw - 32px));
      background: #17171a; border: 1px solid #2a2a2f; border-radius: 12px;
      padding: 32px 28px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 8px; }
    p { color: #a8a8ae; }
    a { color: #6aa6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    button {
      background: #2a2a2f; color: #e6e6e6; border: 1px solid #3a3a40;
      border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
    }
    button:hover { background: #34343a; }
    .hidden { display: none !important; }
    .muted { color: #777; font-size: .85rem; }
    code { background: #0e0e10; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Running Log</h1>
    <p id="greeting" class="muted">Loading…</p>
    <div id="links" class="hidden">
      <p><a href="/plots/">Open plots →</a></p>
      <div class="row">
        <button id="logout">Sign out</button>
      </div>
    </div>
    <div id="anon" class="hidden">
      <p>You're not signed in.</p>
      <p><a href="/login.html">Sign in →</a></p>
    </div>
  </main>
  <script>
    async function load() {
      try {
        const r = await fetch("/api/auth/me");
        if (r.status === 401 || r.status === 403) {
          document.getElementById("greeting").classList.add("hidden");
          document.getElementById("anon").classList.remove("hidden");
          return;
        }
        const me = await r.json();
        document.getElementById("greeting").textContent = `Signed in as ${me.email}.`;
        document.getElementById("links").classList.remove("hidden");
      } catch {
        document.getElementById("greeting").textContent = "Could not contact server.";
      }
    }
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      location.reload();
    });
    load();
  </script>
</body>
</html>
