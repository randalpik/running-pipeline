name: build-and-deploy

on:
  workflow_dispatch:
    inputs:
      historical:
        description: "Re-freeze historical (regenerates historical_daily.csv)"
        type: boolean
        default: false
      fit:
        description: "Run the Bayesian CS fit (slow, ~5-20 min)"
        type: boolean
        default: false
  # Sheets-trigger Apps Script (scripts/sheets_trigger.gs) POSTs here when
  # a Workout cell finishes settling. event_type controls flags via the
  # client_payload; see "Resolve inputs" step below.
  repository_dispatch:
    types: [pipeline-run, pipeline-run-fit]

permissions:
  contents: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # multi-profile build + Coros watch-cache sync; the
                          # first run seeds ~2200 rich details (one-time, slow)
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        # Normalize the run's flags from either workflow_dispatch inputs
        # (manual / admin button) or repository_dispatch client_payload
        # (Sheets trigger). All later steps read steps.cfg.outputs.*.
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            fit="${{ github.event.client_payload.fit }}"
            historical="${{ github.event.client_payload.historical }}"
          else
            fit="${{ inputs.fit }}"
            historical="${{ inputs.historical }}"
          fi
          [ "$fit" = "true" ] || fit="false"
          [ "$historical" = "true" ] || historical="false"
          echo "fit=$fit" >> "$GITHUB_OUTPUT"
          echo "historical=$historical" >> "$GITHUB_OUTPUT"
          echo "Resolved: fit=$fit historical=$historical (via ${{ github.event_name }})"

      - name: Restore pipeline state cache
        # Persists pipeline state across CI runs, so we don't refit /
        # re-freeze / re-geocode on every build. These files are NOT
        # committed to the repo:
        #   - city_coords.csv     (Nominatim cache; lists visited cities)
        #   - historical_daily.csv  (--historical output)
        #   - bayes_cs_*            (--fit output, ~16 min to regenerate)
        # The cache evicts after 7 days idle; if that happens, dispatch
        # one run with --fit and --historical to repopulate. (city_coords
        # also rebuilds itself on cache miss — slow first time, ~110s for
        # ~100 cities at the Nominatim rate limit.)
        id: state_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/city_coords.csv
            data/reverse_coords.csv
            data/historical_daily.csv
            data/bayes_cs_summary.csv
            data/bayes_cs_params.csv
            data/bayes_cs_auto_exclusions.csv
            data/watch_activities.csv
            data/weather_measured.csv
            data/elevation_measured.csv
            data/elevation_splits.csv
            data/altitude_daily.csv
            data/time_daily.csv
            data/long_run_measured.csv
            data/recovery_measured.csv
            data/long_run_calibration.csv
            data/dem_cache.json
            data/profiles/coros/details
            data/profiles/coros/coros_token.json
            data/profiles/coros/coros_current_log.csv
            data/profiles/maddy/coros_current_log.csv
            data/profiles/maddy/coros_token.json
            data/profiles/maddy/city_coords.csv
            data/profiles/maddy/details
            data/profiles/maddy/bayes_cs_summary.csv
            data/profiles/maddy/bayes_cs_params.csv
            data/profiles/maddy/bayes_cs_auto_exclusions.csv
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      - name: Warn on cache miss
        if: steps.state_restore.outputs.cache-matched-key == ''
        run: |
          echo "::warning::No pipeline-state cache restored (first run or >7d idle). Plots that depend on bayes_cs_* or historical_daily will fail unless this run is dispatched with --fit and --historical set."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-fit.txt

      - name: Install BLAS dev headers (PyTensor)
        if: steps.cfg.outputs.fit == 'true'
        # PyTensor compiles C ops on the fly and needs the dev headers (not
        # just the runtime libs) to link against BLAS/LAPACK. Without these
        # NUTS falls back to non-BLAS gradient evaluation and is 2-5x slower.
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ steps.cfg.outputs.fit }}" = "true" ]; then
            pip install -r requirements-fit.txt
          else
            pip install -r requirements.txt
          fi

      - name: Write Drive service-account credentials
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "GCP_SA_JSON secret is empty; aborting." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$GCP_SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Sync Max's watch cache (Coros)
        # Populate data/profiles/coros/details (Max's watch account) WITHOUT
        # rendering the hidden coros test profile — the Max Drive build below
        # enriches from this cache (run_pipeline.sh reads it for weather,
        # elevation, altitude, reps, long-run reconciliation). Incremental
        # after the one-time seed; the cache persists via the state cache.
        # Soft-fails so a Coros outage degrades Max to log-only rather than
        # failing the whole deploy.
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: |
          if [ -z "$COROS_EMAIL" ] || [ -z "$COROS_PASSWORD" ]; then
            echo "::warning::COROS_EMAIL/PASSWORD unset — skipping watch-cache sync; Max builds log-only."
          else
            python scripts/build_profiles.py --only coros --sync-only \
              || echo "::warning::watch-cache sync failed — Max builds from the last cached details."
          fi

      - name: Build production profiles
        # Builds Max (Drive, enriched from the watch cache synced above) and
        # Maddy (Coros). Renders each profile's plots, writes the profile-
        # switcher shell, and stages into site/dist (Max -> root, Maddy ->
        # profiles/maddy/). The coros test profile is NOT built here (it's a
        # cache provider only in production); --only keeps it out. Maddy's
        # Coros sync is incremental and their CS fit is cached (see cache step).
        id: build
        # Self-limit BELOW the 120-min job timeout. A one-time DEM elevation
        # cold seed can run for hours at the public API's 1 req/s; capping the
        # step (rather than letting the JOB time out) turns an over-run into a
        # normal step failure, so the always-on cache save below still runs and
        # uploads the partially-warmed cache. The next dispatch resumes from it
        # (the seed is incremental and flushes as it goes), so it converges over
        # a few runs instead of restarting cold every time.
        timeout-minutes: 100
        env:
          COROS2_EMAIL: ${{ secrets.COROS2_EMAIL }}
          COROS2_PASSWORD: ${{ secrets.COROS2_PASSWORD }}
          RP_PRODUCTION: "1"
        run: |
          flags=()
          [ "${{ steps.cfg.outputs.historical }}" = "true" ] && flags+=(--historical)
          [ "${{ steps.cfg.outputs.fit }}" = "true" ] && flags+=(--fit)
          python scripts/build_profiles.py --only max,maddy "${flags[@]}"

      - name: Save pipeline state cache
        # Save a fresh cache entry under a unique key after every run (success
        # OR failure) so the next run picks it up via the restore-keys prefix
        # match. Old entries naturally evict after 7 days idle.
        #
        # if: always() (not success()) is load-bearing: when the build step is
        # killed by its timeout it has already flushed the partially-warmed DEM
        # cache (and synced details) to disk, but those evaporate with the runner
        # unless we upload them. Saving on failure too lets the expensive,
        # incrementally-built caches ratchet forward across runs. Every cached
        # file is additive/idempotent and written atomically, so a partial save
        # is strictly more progress, never corruption. The deploy step keeps its
        # default success() gate, so a cut-off run warms the cache but never
        # ships a half-built site.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/city_coords.csv
            data/reverse_coords.csv
            data/historical_daily.csv
            data/bayes_cs_summary.csv
            data/bayes_cs_params.csv
            data/bayes_cs_auto_exclusions.csv
            data/watch_activities.csv
            data/weather_measured.csv
            data/elevation_measured.csv
            data/elevation_splits.csv
            data/altitude_daily.csv
            data/time_daily.csv
            data/long_run_measured.csv
            data/recovery_measured.csv
            data/long_run_calibration.csv
            data/dem_cache.json
            data/profiles/coros/details
            data/profiles/coros/coros_token.json
            data/profiles/coros/coros_current_log.csv
            data/profiles/maddy/coros_current_log.csv
            data/profiles/maddy/coros_token.json
            data/profiles/maddy/city_coords.csv
            data/profiles/maddy/details
            data/profiles/maddy/bayes_cs_summary.csv
            data/profiles/maddy/bayes_cs_params.csv
            data/profiles/maddy/bayes_cs_auto_exclusions.csv
          key: pipeline-state-v1-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Deploy to Netlify
        working-directory: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GHA build ${{ github.run_id }}"
