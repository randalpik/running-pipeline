name: build-and-deploy

on:
  workflow_dispatch:
    inputs:
      historical:
        description: "Re-freeze historical (regenerates historical_daily.csv)"
        type: boolean
        default: false
      fit:
        description: "Run the Bayesian CS fit (slow, ~5-20 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore pipeline state cache
        # Persists pipeline state across CI runs, so we don't refit /
        # re-freeze / re-geocode on every build. These files are NOT
        # committed to the repo:
        #   - city_coords.csv     (Nominatim cache; lists visited cities)
        #   - historical_daily.csv  (--historical output)
        #   - bayes_cs_*            (--fit output, ~16 min to regenerate)
        # The cache evicts after 7 days idle; if that happens, dispatch
        # one run with --fit and --historical to repopulate. (city_coords
        # also rebuilds itself on cache miss — slow first time, ~110s for
        # ~100 cities at the Nominatim rate limit.)
        id: state_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/city_coords.csv
            data/historical_daily.csv
            data/bayes_cs_summary.csv
            data/bayes_cs_params.csv
            data/bayes_cs_auto_exclusions.csv
          key: pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            pipeline-state-v1-

      - name: Warn on cache miss
        if: steps.state_restore.outputs.cache-matched-key == ''
        run: |
          echo "::warning::No pipeline-state cache restored (first run or >7d idle). Plots that depend on bayes_cs_* or historical_daily will fail unless this run is dispatched with --fit and --historical set."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-fit.txt

      - name: Install BLAS dev headers (PyTensor)
        if: ${{ inputs.fit }}
        # PyTensor compiles C ops on the fly and needs the dev headers (not
        # just the runtime libs) to link against BLAS/LAPACK. Without these
        # NUTS falls back to non-BLAS gradient evaluation and is 2-5x slower.
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.fit }}" = "true" ]; then
            pip install -r requirements-fit.txt
          else
            pip install -r requirements.txt
          fi

      - name: Write Drive service-account credentials
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          if [ -z "$GCP_SA_JSON" ]; then
            echo "GCP_SA_JSON secret is empty; aborting." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$GCP_SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run pipeline
        run: |
          flags=()
          [ "${{ inputs.historical }}" = "true" ] && flags+=(--historical)
          [ "${{ inputs.fit }}" = "true" ] && flags+=(--fit)
          ./scripts/run_pipeline.sh "${flags[@]}"

      - name: Generate plots
        run: ./scripts/run_plots.sh

      - name: Save pipeline state cache
        # Save a fresh cache entry under a unique key after every successful
        # pipeline run so the next run picks it up via the restore-keys
        # prefix match. Old entries naturally evict after 7 days idle.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/city_coords.csv
            data/historical_daily.csv
            data/bayes_cs_summary.csv
            data/bayes_cs_params.csv
            data/bayes_cs_auto_exclusions.csv
          key: pipeline-state-v1-${{ github.run_id }}

      - name: Stage site/dist
        run: |
          mkdir -p site/dist
          cp -R output/* site/dist/
          rm -rf site/dist/debug

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Deploy to Netlify
        working-directory: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GHA build ${{ github.run_id }}"
